<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | LinkPulse</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-toolbar">
      <button id="themeToggleBtn" class="auth-theme-toggle" type="button">Dark mode</button>
    </div>
    <form id="registerForm" class="auth-card">
      <h2>Create account</h2>
      <div class="field-group">
        <label for="name">Name</label>
        <input type="text" id="name" required />
      </div>

      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>

      <button type="submit" class="btn btn-primary">Register</button>
      <p class="switch-text">Already a member? <a href="login.html">Login</a></p>
      <div id="message" class="message"></div>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const result = await register(name, email, password);
      if (result.success) {
        window.location.href = 'login.html';
      }
    });
  </script>
</body>
</html>
