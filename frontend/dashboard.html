<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | LinkPulse</title>
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <div class="brand">LinkPulse</div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="create-url.html">Create URL</a>
        <a href="admin.html" id="adminLink" hidden>Admin</a>
        <button id="themeToggleBtn" class="btn btn-secondary small" type="button">Dark mode</button>
        <button id="logoutBtn" class="btn btn-secondary small">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container dashboard">
    <section class="topbar">
      <div>
        <h1 id="welcomeText">Dashboard</h1>
      </div>
      <a href="create-url.html" class="btn btn-primary">Create URL</a>
    </section>

    <section class="stats-grid">
      <div class="stat-card">
        <p>Total URLs</p>
        <h3 id="totalUrls">0</h3>
      </div>
      <div class="stat-card">
        <p>Total Clicks</p>
        <h3 id="totalClicks">0</h3>
      </div>
    </section>

    <section class="panel">
      <h2>Your URLs</h2>
      <div id="urlTableContainer"></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
