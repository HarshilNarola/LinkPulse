<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | LinkPulse</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-toolbar"><button id="themeToggleBtn" class="auth-theme-toggle" type="button">Dark mode</button></div>
    <form id="forgotPasswordForm" class="auth-card">
      <h2>Forgot password</h2>
      <p class="form-help">Enter your account email and we will send a reset link.</p>
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <button type="submit" class="btn btn-primary">Send reset link</button>
      <p class="switch-text"><a href="login.html">Back to login</a></p>
      <div id="message" class="message"></div>
    </form>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/theme.js"></script>
  <script>
    document.getElementById('forgotPasswordForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const message = document.getElementById('message');
      try {
        const response = await apiRequest('/api/auth/forgot-password', {
          method: 'POST', body: { email: document.getElementById('email').value }, requiresAuth: false,
        });
        message.textContent = response.message;
        message.style.color = '#15803d';
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
