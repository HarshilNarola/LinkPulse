<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | LinkPulse</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-toolbar"><button id="themeToggleBtn" class="auth-theme-toggle" type="button">Dark mode</button></div>
    <form id="resetPasswordForm" class="auth-card">
      <h2>Reset password</h2>
      <div class="field-group">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password" />
      </div>
      <div class="field-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" />
      </div>
      <button type="submit" class="btn btn-primary">Reset password</button>
      <p class="switch-text"><a href="login.html">Back to login</a></p>
      <div id="message" class="message"></div>
    </form>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/theme.js"></script>
  <script>
    document.getElementById('resetPasswordForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const message = document.getElementById('message');
      const password = document.getElementById('password').value;
      if (password !== document.getElementById('confirmPassword').value) {
        message.textContent = 'Passwords do not match.';
        return;
      }
      try {
        await apiRequest('/api/auth/reset-password', {
          method: 'POST',
          body: { token: new URLSearchParams(window.location.search).get('token'), new_password: password },
          requiresAuth: false,
        });
        message.textContent = 'Password reset successfully. You can now log in.';
        message.style.color = '#15803d';
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
