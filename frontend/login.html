<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | LinkPulse</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-toolbar">
      <button id="themeToggleBtn" class="auth-theme-toggle" type="button">Dark mode</button>
    </div>
    <form id="loginForm" class="auth-card">
      <h2>Login</h2>
      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" required />
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" required />
      </div>

      <button type="submit" class="btn btn-primary">Login</button>
      <p class="switch-text"><a href="forgot-password.html">Forgot password?</a></p>
      <p class="switch-text">Need an account? <a href="register.html">Register</a></p>
      <div id="message" class="message"></div>
    </form>
  </div>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const result = await login(email, password);
      if (result.success) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
</html>
