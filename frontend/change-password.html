<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Change Password | LinkPulse</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-toolbar"><button id="themeToggleBtn" class="auth-theme-toggle" type="button">Dark mode</button></div>
    <form id="changePasswordForm" class="auth-card">
      <h2>Change password</h2>
      <div class="field-group"><label for="currentPassword">Current password</label><input type="password" id="currentPassword" required minlength="8" autocomplete="current-password" /></div>
      <div class="field-group"><label for="newPassword">New password</label><input type="password" id="newPassword" required minlength="8" autocomplete="new-password" /></div>
      <div class="field-group"><label for="confirmPassword">Confirm new password</label><input type="password" id="confirmPassword" required minlength="8" autocomplete="new-password" /></div>
      <button type="submit" class="btn btn-primary">Change password</button>
      <p class="switch-text"><a href="dashboard.html">Back to dashboard</a></p>
      <div id="message" class="message"></div>
    </form>
  </div>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script>
    requireAuth();
    document.getElementById('changePasswordForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const message = document.getElementById('message');
      const newPassword = document.getElementById('newPassword').value;
      if (newPassword !== document.getElementById('confirmPassword').value) {
        message.textContent = 'Passwords do not match.';
        return;
      }
      try {
        const response = await apiRequest('/api/auth/change-password', {
          method: 'POST',
          body: { current_password: document.getElementById('currentPassword').value, new_password: newPassword },
          token: getToken(),
        });
        message.textContent = response.message;
        message.style.color = '#15803d';
        document.getElementById('changePasswordForm').reset();
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
