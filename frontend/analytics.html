<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics | LinkPulse</title>
  <link rel="stylesheet" href="css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <div class="brand">LinkPulse</div>
      <div class="nav-links">
        <a href="dashboard.html">Dashboard</a>
        <a href="create-url.html">Create URL</a>
        <a href="admin.html" id="adminLink" hidden>Admin</a>
        <button id="themeToggleBtn" class="btn btn-secondary small" type="button">Dark mode</button>
        <button id="logoutBtn" class="btn btn-secondary small">Logout</button>
      </div>
    </div>
  </nav>

  <main class="container dashboard analytics-page">
    <section class="stats-grid analytics-stats">
      <div class="stat-card"><p>Total Clicks</p><h3 id="totalClicks">0</h3></div>
      <div class="stat-card"><p>Today</p><h3 id="clicksToday">0</h3></div>
      <div class="stat-card"><p>This Week</p><h3 id="clicksWeek">0</h3></div>
      <div class="stat-card"><p>This Month</p><h3 id="clicksMonth">0</h3></div>
    </section>

    <section class="panel chart-grid analytics-charts">
      <div class="chart-card">
        <h3>Clicks Over Time</h3>
        <canvas id="lineChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>Devices</h3>
        <canvas id="deviceChart"></canvas>
      </div>
      <div class="chart-card wide">
        <h3>Browsers</h3>
        <canvas id="browserChart"></canvas>
      </div>
    </section>

    <section id="analyticsEmptyState" class="panel analytics-empty hidden">
      <h2>No analytics selected</h2>
      <p>Open analytics from one of your URLs on the dashboard.</p>
      <a href="dashboard.html" class="btn btn-primary">Back to Dashboard</a>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/analytics.js"></script>
</body>
</html>
