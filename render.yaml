services:
  - type: web
    name: linkpulse
    runtime: docker
    rootDir: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkpulse-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '30'
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: '7'
      - key: BACKEND_CORS_ORIGINS
        value: https://linkpulse.onrender.com

databases:
  - name: linkpulse-db
    plan: free
