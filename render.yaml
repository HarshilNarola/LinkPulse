services:
  - type: web
    name: linkpulse
    runtime: docker
    rootDir: .
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkpulse-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '30'
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: '7'
      - key: BACKEND_CORS_ORIGINS
        value: https://linkpulse.onrender.com
      - key: FRONTEND_URL
        value: https://linkpulse.onrender.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false

databases:
  - name: linkpulse-db
    plan: free
